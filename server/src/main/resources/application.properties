server.port=9090
spring.application.name=zhiwei-food-server

# ---- H2 嵌入式数据库（无需安装任何数据库服务端）----
spring.datasource.url=jdbc:h2:file:./data/zhiwei;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# 不输出的字段直接忽略（避免把 null 暴露给前端）
spring.jackson.default-property-inclusion=non_null

# ---- JWT ----
zhiwei.jwt.secret=ZHIWEI_FOOD_SECRET_KEY_2026_CHANGE_ME_IN_PROD
zhiwei.jwt.expire-hours=24

# ---- CORS：允许前端开发服务器（Vite 8080 / preview 4173）跨域带凭证 ----
zhiwei.cors.allowed-origins=http://localhost:8080,http://localhost:4173
